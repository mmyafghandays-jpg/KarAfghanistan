name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          echo "Project contents:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: extracted/KarAfghanistanFirebase
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarAfghanistan-APK
          path: extracted/KarAfghanistanFirebase/app/build/outputs/apk/debug/app-debug.apk
